# Root Hydra config for DiMamba pretraining on ENCODE V4 cCREs.
# Overrides MDLM defaults (text-diffusion → DNA, 350 bp, vocab=6, etc.).
defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - data: data_encode_ccre
  - model: dna-dimamba
  - /strategy: ddp
  - /noise: loglinear
  - /lr_scheduler: constant_warmup

mode: train
diffusion: absorbing_state
backbone: dimamba
parameterization: subs
time_conditioning: True              # MDLM scores depend on σ
T: 0
subs_masking: False

seed: 42

loader:
  global_batch_size: 1024
  eval_global_batch_size: 1024
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: 4
  pin_memory: True

sampling:
  predictor: ddpm_cache
  steps: 128
  noise_removal: True
  num_sample_batches: 1
  num_sample_log: 0
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False

eval:
  checkpoint_path: ''
  disable_ema: False
  compute_generative_perplexity: False         # we'll do 3-mer R QC instead
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large
  generate_samples: False

optim:
  weight_decay: 0
  lr: 1e-3                 # paper §3 setting
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 320000        # paper §3 budget
  log_every_n_steps: 50
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  # Lightning rejects int val_check_interval > batches_per_epoch. Our cCRE
  # train split is 2,113,968 rows / (global batch 1024) ≈ 2064 batches/epoch.
  # At max_steps=320000 this is ~155 epochs, so validating every 2000 batches
  # gives us ~160 validations across the run (close to paper's ~64 cadence).
  val_check_interval: 2000

wandb:
  project: dna-dimamba
  notes: DiMamba pretrain on ENCODE V4 cCRE for DNA-CRAFT comparison
  group: null
  job_type: null
  name: null
  id: ${.name}_${seed}
  tags:
    - ${noise.type}
    - ${data.train}
    - ${data.valid}

hydra:
  searchpath:
    - file://${HOME}/mdlm/configs
  run:
    dir: ${GPA_REPO_ROOT}/results/dna_craft_comparison/enhancer/mdlm_dimamba/hydra_outputs/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  save_dir: ${GPA_REPO_ROOT}/results/dna_craft_comparison/enhancer/mdlm_dimamba
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
