# DiMamba backbone for DNA-CRAFT enhancer comparison.
# Matches paper Table 5 (~1.93 M params): hidden=128, length=350, n_blocks=10,
# n_heads=8, BiMambaConfig(bidirectional=True, strategy='add'), tied weights.
name: dna_tiny
type: dimamba
hidden_size: 128
cond_dim: 128
length: 350
n_blocks: 10
n_heads: 8
scale_by_sigma: True
dropout: 0.1
temb_strategy: adaln
tie_word_embeddings: True
