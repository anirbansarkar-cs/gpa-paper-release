# Main GPA environment: sampler, backbones, and the Enformer/LegNet oracles.
#
# Versions are the ones the reported runs used. These are the direct
# dependencies only -- transitive pins are left to the resolver, so this
# installs cleanly on a different machine rather than reproducing one exactly.
#
#   conda env create -f environment.yml
#   conda activate gpa
#   pip install -e .
#
# The held-out AlphaGenome oracle runs in a separate environment; see
# environment-alphagenome.yml.
name: gpa
channels:
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
      # PyTorch build used for the reported runs (CUDA 12.4 wheels).
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1
      # Core numerics
      - numpy==1.26.3
      - scipy==1.13.1
      - pandas==2.2.2
      - h5py==3.11.0
      - tqdm==4.67.3
      - scikit-learn==1.6.1
      # Checkpoint loading for the MDLM / LegNet checkpoints
      - pytorch-lightning==2.3.1
      - torchmetrics==1.6.1
      - omegaconf==2.3.0
      # HyenaDNA backbone
      - transformers==4.46.0
      # Enformer activity oracles
      - grelu==1.0.10
      # LEDIDI baseline
      - ledidi==2.1.0

# Not installed here, because they are not on PyPI and the wrappers add them to
# sys.path instead:
#   diffusion_gosai / diffusion_gosai_update  -- DRAKES release
#   diffusion_lentimpra                       -- MDLM LentiMPRA training code
#   reglm                                     -- Ctrl-DNA release
#
# Optional, only for `--backbone dimamba`:
#   mamba_ssm, causal_conv1d  (see the note at the top of
#   scripts/dna_craft_comparison/enhancer/mdlm_wrapper.py)
